name: wr-alert

on:
  schedule:
    - cron: "5 15 * * *"    # 매일 00:05 (한국시간) — 일봉 마감 직후 확인
    - cron: "40 15 * * *"   # 00:40 한 번 더 (GitHub 실행 지연·누락 대비, 중복 알림 없음)
    - cron: "20 * * * *"    # 매시 20분 — 장중 지정가 체결·목표가 도달 확인 (90일선 전략)
  workflow_dispatch:         # Actions 탭에서 수동 실행 (자정 확인과 같은 동작)

permissions:
  contents: write            # 알림·가상 매매 기록 저장

concurrency:
  group: wr-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 신호 확인 + 가상 매매 결과 업데이트
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "20 * * * *" ]; then
            python3 wr_alert.py --intraday
          else
            python3 wr_alert.py
          fi

      - name: 기록 저장 (바뀌었을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in wr_state.json trades.csv; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "update state" && git push)
